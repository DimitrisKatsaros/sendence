<!-- From Uiverse.io by Galahhad -->
<!-- Link: https://uiverse.io/switches -->
<label class="theme-switch">
  <input
    type="checkbox"
    class="theme-switch__checkbox"
    [checked]="isDarkMode()"
    (change)="toggleTheme()"
  />
  <div class="theme-switch__container">
    <div class="theme-switch__clouds"></div>
    <div class="theme-switch__stars-container">
      <svg viewBox="0 0 100 40" fill="currentColor">
        <circle cx="15" cy="8" r="1" />
        <circle cx="25" cy="15" r="0.8" />
        <circle cx="35" cy="6" r="1.2" />
        <circle cx="50" cy="12" r="0.6" />
        <circle cx="65" cy="18" r="1" />
        <circle cx="75" cy="8" r="0.8" />
        <circle cx="85" cy="14" r="1.1" />
      </svg>
    </div>
    <div class="theme-switch__circle-container">
      <div class="theme-switch__sun-moon-container">
        <div class="theme-switch__moon">
          <div class="theme-switch__spot"></div>
          <div class="theme-switch__spot"></div>
          <div class="theme-switch__spot"></div>
        </div>
      </div>
    </div>
  </div>
</label>
